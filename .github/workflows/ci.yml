name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-progress --no-fund --no-audit || npm ci --no-progress --no-fund --no-audit
        # retry once: npm's "Exit handler never called" crash (npm/cli#29023) hits trees with
        # native deps (better-sqlite3) on hosted runners; the second pass succeeds
      - run: node_modules/.bin/tsc -p tsconfig.json --noEmit
      - run: node_modules/.bin/vitest run
