name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest] # P2-1: the macOS story runs for real (sandbox-exec, darwin paths)
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # lockfile must carry only registry.npmjs.org URLs — generated on a box whose npm
      # defaults to a Tencent-internal mirror, which hosted runners cannot reach
      - run: sudo apt-get install -y bubblewrap # real bwrap confinement test (v0.9-2); linux only — macOS confines with the built-in sandbox-exec
        if: runner.os == 'Linux'
      - run: grep -q tencentyun package-lock.json && exit 1 || true
      - run: npm ci --no-fund --no-audit
      - run: node_modules/.bin/tsc -p tsconfig.json --noEmit
      - run: node_modules/.bin/vitest run
