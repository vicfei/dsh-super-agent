name: publish

# Trusted Publishing (OIDC): no tokens, no OTP, no chat-relayed secrets.
# Requires a one-time binding on npmjs.com: package settings → Trusted Publisher
# → repository `vicfei/dsh-super-agent`, workflow `publish.yml`, environment empty.
# For a package not yet published, do the first publish manually (device auth),
# then bind — after that, pushing a v* tag publishes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for a publish grant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm >= 11.5.1; Node 20 bundles 10.x, which silently
      # publishes anonymously → E404 on the scoped PUT (first v0.5.1 attempt, 2026-11-02).
      - run: npm install -g npm@latest && npm --version
      - run: grep -q tencentyun package-lock.json && exit 1 || true
      - run: npm ci --no-fund --no-audit
      - run: npm publish --access public
