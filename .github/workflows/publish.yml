name: publish

# Trusted Publishing (OIDC): no tokens, no OTP, no chat-relayed secrets.
# Requires a one-time binding on npmjs.com: package settings → Trusted Publisher
# → repository `vicfei/dsh-super-agent`, workflow `publish.yml`, environment empty.
# For a package not yet published, do the first publish manually (device auth),
# then bind — after that, pushing a v* tag publishes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for a publish grant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs node >=22.14 AND npm >=11.5.1 (docs.npmjs.com/trusted-publishers).
          # Node 20 is not enough regardless of npm: the first v0.5.1 attempts (2026-11-02) failed
          # E404 on the scoped PUT — too-old npm publishes anonymously instead of doing the OIDC exchange.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11 && npm --version # guarantee >=11.5.1 even if the distro npm lags
      - run: grep -q tencentyun package-lock.json && exit 1 || true
      - run: npm ci --no-fund --no-audit
      - run: npm publish --access public
