<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606A"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8250DF"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="1112" height="742" rx="14" fill="#F6F8FA" stroke="#C6CDD5" stroke-width="1.5"/>

  <!-- ══ sources row ══ -->
  <text x="36" y="22" font-size="11" font-weight="700" fill="#57606A">SOURCES — five channels, one admission table</text>
  <rect x="30" y="30" width="176" height="54" rx="9" fill="#FFFFFF" stroke="#C6CDD5" stroke-width="1.5"/>
  <text x="118" y="51" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A4A">GitHub</text>
  <text x="118" y="69" text-anchor="middle" font-size="10.5" fill="#57606A">issues · PRs · PAT or App</text>
  <rect x="216" y="30" width="176" height="54" rx="9" fill="#FFFFFF" stroke="#C6CDD5" stroke-width="1.5"/>
  <text x="304" y="51" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A4A">Feishu</text>
  <text x="304" y="69" text-anchor="middle" font-size="10.5" fill="#57606A">IM · long connection</text>
  <rect x="402" y="30" width="176" height="54" rx="9" fill="#FFFFFF" stroke="#C6CDD5" stroke-width="1.5"/>
  <text x="490" y="51" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A4A">Slack</text>
  <text x="490" y="69" text-anchor="middle" font-size="10.5" fill="#57606A">IM · Socket Mode</text>
  <rect x="588" y="30" width="176" height="54" rx="9" fill="#FFFFFF" stroke="#C6CDD5" stroke-width="1.5"/>
  <text x="676" y="51" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A4A">Telegram</text>
  <text x="676" y="69" text-anchor="middle" font-size="10.5" fill="#57606A">IM · Bot API poll</text>
  <rect x="774" y="30" width="176" height="54" rx="9" fill="#FFFFFF" stroke="#C6CDD5" stroke-width="1.5"/>
  <text x="862" y="51" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A4A">WeChat</text>
  <text x="862" y="69" text-anchor="middle" font-size="10.5" fill="#57606A">IM · iLink · QR login</text>

  <line x1="118" y1="84" x2="118" y2="98" stroke="#57606A" stroke-width="1.4"/>
  <line x1="304" y1="84" x2="304" y2="98" stroke="#57606A" stroke-width="1.4"/>
  <line x1="490" y1="84" x2="490" y2="98" stroke="#57606A" stroke-width="1.4"/>
  <line x1="676" y1="84" x2="676" y2="98" stroke="#57606A" stroke-width="1.4"/>
  <line x1="862" y1="84" x2="862" y2="98" stroke="#57606A" stroke-width="1.4"/>
  <line x1="118" y1="98" x2="862" y2="98" stroke="#57606A" stroke-width="1.4"/>
  <line x1="480" y1="98" x2="480" y2="114" stroke="#57606A" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="494" y="110" font-size="10.5" font-style="italic" fill="#57606A">triggers (restart-safe read positions)</text>

  <!-- ══ gate ══ -->
  <rect x="210" y="118" width="540" height="64" rx="10" fill="#1B2A4A" stroke="#F2B33D" stroke-width="2"/>
  <text x="480" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#F2B33D">GATE — fast path · deterministic</text>
  <text x="480" y="163" text-anchor="middle" font-size="11.5" fill="#FFFFFF">allowed list × admission table × addressing — no model in the loop</text>

  <line x1="750" y1="150" x2="800" y2="150" stroke="#57606A" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="804" y="122" width="146" height="56" rx="9" fill="#EAEEF2" stroke="#C6CDD5" stroke-width="1.5"/>
  <text x="877" y="143" text-anchor="middle" font-size="12" font-weight="600" fill="#57606A">ignore →</text>
  <text x="877" y="160" text-anchor="middle" font-size="10.5" fill="#57606A">recorded, nothing happens</text>

  <line x1="480" y1="182" x2="480" y2="204" stroke="#57606A" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="492" y="199" font-size="10.5" font-style="italic" fill="#57606A">inferred candidates only</text>

  <!-- ══ mode ladder ══ -->
  <rect x="24" y="196" width="170" height="112" rx="10" fill="#FFFFFF" stroke="#C6CDD5" stroke-width="1.5"/>
  <text x="109" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="#1B2A4A">MODE LADDER</text>
  <circle cx="46" cy="240" r="6" fill="#CF222E"/>
  <text x="60" y="244" font-size="12.5" font-weight="600" fill="#1B2A4A">off</text>
  <circle cx="46" cy="266" r="6" fill="#F0A500"/>
  <text x="60" y="270" font-size="12.5" font-weight="600" fill="#1B2A4A">observe</text>
  <circle cx="46" cy="292" r="6" fill="#2DA44E"/>
  <text x="60" y="296" font-size="12.5" font-weight="600" fill="#1B2A4A">auto</text>
  <line x1="194" y1="250" x2="206" y2="250" stroke="#57606A" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ══ assessment ══ -->
  <rect x="210" y="208" width="540" height="76" rx="10" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/>
  <text x="480" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2A4A">ASSESSMENT — slow path</text>
  <text x="480" y="250" text-anchor="middle" font-size="11.5" fill="#57606A">any OpenAI-compatible endpoint · one call per thread</text>
  <text x="480" y="268" text-anchor="middle" font-size="11.5" fill="#57606A">errors fail closed to negative</text>

  <line x1="480" y1="284" x2="480" y2="306" stroke="#57606A" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="492" y="300" font-size="10.5" font-style="italic" fill="#57606A">accept — observe records would-accept</text>

  <!-- ══ ticket + context + speculative chips ══ -->
  <rect x="470" y="308" width="180" height="40" rx="9" fill="#F2B33D"/>
  <text x="560" y="333" text-anchor="middle" font-size="14" font-weight="800" fill="#1B2A4A">TICKET</text>

  <rect x="210" y="308" width="240" height="40" rx="9" fill="#FFF8E6" stroke="#F2B33D" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="330" y="324" text-anchor="middle" font-size="10.5" font-weight="700" fill="#8A6A12">SPECULATIVE</text>
  <text x="330" y="339" text-anchor="middle" font-size="10" fill="#8A6A12">silent rehearsal → human promote</text>
  <line x1="450" y1="328" x2="468" y2="328" stroke="#F2B33D" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="680" y="308" width="270" height="40" rx="9" fill="#EAEEF2" stroke="#C6CDD5" stroke-width="1.5"/>
  <text x="815" y="324" text-anchor="middle" font-size="10.5" font-weight="600" fill="#57606A">follow-ups join as context (bypass)</text>
  <text x="815" y="339" text-anchor="middle" font-size="10" fill="#57606A">long text spills to .dsh/spill/&lt;id&gt;.md</text>
  <line x1="650" y1="328" x2="678" y2="328" stroke="#57606A" stroke-width="1.4"/>

  <line x1="560" y1="348" x2="560" y2="368" stroke="#57606A" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ══ executor ══ -->
  <rect x="180" y="370" width="600" height="84" rx="10" fill="#1B2A4A"/>
  <text x="480" y="393" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">EXECUTOR — any CLI agent in a subprocess</text>
  <text x="480" y="413" text-anchor="middle" font-size="11.5" fill="#9FB0CC">per-ticket git worktree · sandboxed (bwrap / sandbox-exec) · group-kill timeout</text>
  <text x="480" y="436" text-anchor="middle" font-size="12.5" fill="#F2B33D">claude · codex · opencode · aider · anything</text>

  <!-- ══ watchdog ══ -->
  <rect x="180" y="470" width="280" height="58" rx="10" fill="#FFFFFF" stroke="#57606A" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="320" y="491" text-anchor="middle" font-size="12" font-weight="700" fill="#57606A">WATCHDOG — outside loop</text>
  <text x="320" y="509" text-anchor="middle" font-size="10.5" fill="#57606A">observes · nudges · never admits, never kills</text>
  <line x1="320" y1="468" x2="320" y2="456" stroke="#57606A" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <line x1="480" y1="454" x2="480" y2="552" stroke="#57606A" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="492" y="520" font-size="10.5" font-style="italic" fill="#57606A">commits</text>

  <!-- ══ delivery ══ -->
  <rect x="180" y="556" width="280" height="64" rx="10" fill="#FFFFFF" stroke="#2DA44E" stroke-width="2"/>
  <text x="320" y="580" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2A4A">bot-identity PR</text>
  <text x="320" y="600" text-anchor="middle" font-size="11" fill="#57606A">GitHub App token · branch dsh/ticket-N</text>
  <line x1="460" y1="588" x2="500" y2="588" stroke="#57606A" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="504" y="556" width="420" height="64" rx="10" fill="#1B2A4A" stroke="#2DA44E" stroke-width="2"/>
  <text x="714" y="580" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2DA44E">MERGE GATE — structural brakes</text>
  <text x="714" y="600" text-anchor="middle" font-size="11" fill="#FFFFFF">approval covers head SHA · CI green · ±line cap · one-person veto</text>

  <!-- ══ human surface rail ══ -->
  <rect x="952" y="470" width="152" height="150" rx="10" fill="#FFFFFF" stroke="#8250DF" stroke-width="2"/>
  <text x="1028" y="491" text-anchor="middle" font-size="11" font-weight="700" fill="#8250DF">HUMAN SURFACE</text>
  <text x="1028" y="510" text-anchor="middle" font-size="10.5" fill="#57606A">panel</text>
  <text x="1028" y="527" text-anchor="middle" font-size="10.5" fill="#57606A">IM ops digits</text>
  <text x="1028" y="544" text-anchor="middle" font-size="10" fill="#8250DF">1 requeue · 2 stop · 3 detail</text>
  <text x="1028" y="561" text-anchor="middle" font-size="10" fill="#8250DF">1 promote · 2 discard</text>
  <text x="1028" y="578" text-anchor="middle" font-size="10.5" fill="#57606A">GitHub review</text>
  <text x="1028" y="596" text-anchor="middle" font-size="9.5" fill="#57606A">(merge approvals stay here)</text>
  <line x1="952" y1="412" x2="782" y2="412" stroke="#8250DF" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrp)"/>
  <line x1="952" y1="588" x2="926" y2="588" stroke="#8250DF" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrp)"/>

  <!-- ══ outbox replies ══ -->
  <line x1="480" y1="622" x2="480" y2="646" stroke="#57606A" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="180" y="648" width="600" height="54" rx="12" fill="#FFFFFF" stroke="#2DA44E" stroke-width="2"/>
  <text x="480" y="670" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2A4A">replies in the original thread — any channel</text>
  <text x="480" y="689" text-anchor="middle" font-size="11" fill="#57606A">outbox: coalesced · exponential backoff · a receipt for every action</text>

  <!-- ══ footer ══ -->
  <text x="560" y="716" text-anchor="middle" font-size="11" fill="#8B949E">messages, comments and quoted documents only feed the decision — they cannot change permissions</text>
  <text x="560" y="734" text-anchor="middle" font-size="11" font-style="italic" fill="#8B949E">prompt injection is not defended against — it is structurally not listened to</text>
</svg>
