<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606A"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="952" height="722" rx="14" fill="#F6F8FA" stroke="#C6CDD5" stroke-width="1.5"/>

  <!-- source -->
  <rect x="250" y="20" width="460" height="52" rx="10" fill="#FFFFFF" stroke="#C6CDD5" stroke-width="1.5"/>
  <text x="480" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2A4A">GitHub Source</text>
  <text x="480" y="60" text-anchor="middle" font-size="11.5" fill="#57606A">issues · PR comments · mentions</text>

  <line x1="480" y1="72" x2="480" y2="96" stroke="#57606A" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- trigger -->
  <rect x="400" y="98" width="160" height="38" rx="9" fill="#FFFFFF" stroke="#C6CDD5" stroke-width="1.5"/>
  <text x="480" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2A4A">Trigger</text>

  <line x1="480" y1="136" x2="480" y2="160" stroke="#57606A" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- gate -->
  <rect x="210" y="162" width="540" height="68" rx="10" fill="#1B2A4A" stroke="#F2B33D" stroke-width="2"/>
  <text x="480" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#F2B33D">GATE — fast path, deterministic</text>
  <text x="480" y="210" text-anchor="middle" font-size="11.5" fill="#FFFFFF">allowed list × admission table × addressing — no model in the loop</text>

  <!-- ignore branch -->
  <line x1="750" y1="196" x2="800" y2="196" stroke="#57606A" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="804" y="168" width="140" height="58" rx="9" fill="#EAEEF2" stroke="#C6CDD5" stroke-width="1.5"/>
  <text x="874" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#57606A">ignore →</text>
  <text x="874" y="207" text-anchor="middle" font-size="11" fill="#57606A">recorded,</text>
  <text x="874" y="220" text-anchor="middle" font-size="11" fill="#57606A">nothing happens</text>

  <line x1="480" y1="230" x2="480" y2="254" stroke="#57606A" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="492" y="248" font-size="11" font-style="italic" fill="#57606A">candidate</text>

  <!-- mode ladder (left rail) -->
  <rect x="20" y="240" width="170" height="116" rx="10" fill="#FFFFFF" stroke="#C6CDD5" stroke-width="1.5"/>
  <text x="105" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#1B2A4A">MODE LADDER</text>
  <circle cx="42" cy="288" r="6" fill="#CF222E"/>
  <text x="56" y="292" font-size="12.5" font-weight="600" fill="#1B2A4A">off</text>
  <circle cx="42" cy="316" r="6" fill="#F0A500"/>
  <text x="56" y="320" font-size="12.5" font-weight="600" fill="#1B2A4A">observe</text>
  <circle cx="42" cy="344" r="6" fill="#2DA44E"/>
  <text x="56" y="348" font-size="12.5" font-weight="600" fill="#1B2A4A">auto</text>

  <!-- assessment -->
  <line x1="190" y1="298" x2="206" y2="298" stroke="#57606A" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="210" y="254" width="540" height="88" rx="10" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/>
  <text x="480" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2A4A">ASSESSMENT — slow path</text>
  <text x="480" y="298" text-anchor="middle" font-size="11.5" fill="#57606A">any OpenAI-compatible model</text>
  <text x="480" y="314" text-anchor="middle" font-size="11.5" fill="#57606A">optional for explicit · mandatory for inferred</text>
  <text x="480" y="330" text-anchor="middle" font-size="11.5" fill="#57606A">errors fail closed to negative</text>

  <line x1="480" y1="342" x2="480" y2="366" stroke="#57606A" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="492" y="360" font-size="11" font-style="italic" fill="#57606A">accept · observe records “would accept”</text>

  <!-- ticket -->
  <rect x="390" y="368" width="180" height="40" rx="9" fill="#F2B33D"/>
  <text x="480" y="393" text-anchor="middle" font-size="14" font-weight="800" fill="#1B2A4A">TICKET</text>

  <line x1="480" y1="408" x2="480" y2="432" stroke="#57606A" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- executor -->
  <rect x="180" y="434" width="600" height="86" rx="10" fill="#1B2A4A"/>
  <text x="480" y="458" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">EXECUTOR — any CLI agent in a subprocess</text>
  <text x="480" y="478" text-anchor="middle" font-size="11.5" fill="#9FB0CC">per-ticket git worktree · per-ticket env · killed at limits</text>
  <text x="480" y="500" text-anchor="middle" font-size="12.5" fill="#F2B33D">claude · codex · opencode · gemini · aider · anything</text>

  <line x1="480" y1="520" x2="480" y2="544" stroke="#57606A" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- reply -->
  <rect x="230" y="546" width="500" height="56" rx="12" fill="#FFFFFF" stroke="#2DA44E" stroke-width="2"/>
  <text x="480" y="569" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2A4A">reply in the original thread</text>
  <text x="480" y="588" text-anchor="middle" font-size="11" fill="#57606A">one sentence by default, 100 words max</text>

  <!-- footer -->
  <text x="480" y="648" text-anchor="middle" font-size="11" fill="#8B949E">messages, comments and quoted documents only feed the decision — they cannot change permissions</text>
  <text x="480" y="668" text-anchor="middle" font-size="11" font-style="italic" fill="#8B949E">prompt injection is not defended against — it is structurally not listened to</text>
</svg>
